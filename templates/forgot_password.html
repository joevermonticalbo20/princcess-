{% extends 'layout.html' %}
{% block content %}

<style>
   .forgot-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        max-width: 450px; 
        padding: 0 20px;
    }

    .forgot-box {
        background-color: #d7e6fa; 
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        width: 100%;
        text-align: center;
    }

    .forgot-box h3 {
        color: #151435; 
        font-weight: 700;
        margin-bottom: 20px;
        font-size: 24px;
    }

    .form-group { margin-bottom: 20px; text-align: left; }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        color: #151435;
    }

    .input-field input {
        width: 100%;
        padding: 10px;
        border: 1px solid #c0c0c0;
        border-radius: 8px;
        background-color: #ffffff;
        color: #151435;
        outline: none;
        font-size: 14px;
        box-sizing: border-box;
    }

    .input-field input:focus {
        border-color: #151435;
        box-shadow: 0 0 5px rgba(21, 20, 53, 0.5);
    }

    .btn {
        width: 100%;
        border-radius: 8px;
        padding: 10px;
        border: none;
        font-size: 16px;
        background: #151435; 
        color: #d7e6fa;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn:hover { background: #2c3e50; }
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="forgot-container">
  <div class="forgot-box">

    <h3>Forgot Password</h3>

    <!-- SEND OTP FORM -->
    <form id="sendOtpForm">
      <div class="input-field form-group">
        <label>Enter your username</label>
        <input type="text" id="usernameInput" name="username" required>
      </div>

      <button class="btn" type="submit">Send OTP</button>
    </form>

  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

  const sendOtpForm = document.getElementById("sendOtpForm");

  sendOtpForm.addEventListener("submit", async function(e) {
    e.preventDefault();
    e.stopPropagation();

    const username = document.getElementById("usernameInput").value.trim();

    if (!username) {
      Swal.fire({ icon: "error", title: "Please enter username!" });
      return;
    }

    try {
      const formData = new FormData();
      formData.append("username", username);

      const res = await fetch("/forgot-password", { method: "POST", body: formData });
      const data = await res.json();

      if (data.status === "success") {
        showOtpPopup(data.message);
      } else {
        Swal.fire({ icon: "error", title: data.message });
      }
    } catch (error) {
      Swal.fire({ icon: "error", title: "Server Error!" });
    }
  });

  function showOtpPopup(message) {
    let timeLeft = 180;

    // Extract OTP from message
    const otpMatch = message.match(/\d{6}/);
    const otpCode = otpMatch ? otpMatch[0] : '000000';

    Swal.fire({
      title: "Enter OTP & Reset Password",
      html: `
        <div style="width: 100%;">
          <!-- OTP Display -->
          <div style="background: rgba(255, 255, 255, 0.7); padding: 15px; border-radius: 8px; border: 1px solid #151435; margin-bottom: 20px; text-align: center;">
            <div style="font-weight: bold; color: #151435; font-size: 16px;">Your OTP: ${otpCode}</div>
            <div style="font-weight: bold; color: red; margin-top: 5px;" id="otp-timer">Time remaining: 3:00</div>
          </div>

          <!-- OTP Input -->
          <div style="margin-bottom: 20px;">
            <div style="font-weight: 500; margin-bottom: 8px; color: #151435; font-size: 0.95rem;">OTP (6 digits)</div>
            <input type="text" id="otpInput" 
                style="width: 100%; padding: 10px 12px; border: 1px solid #151435; border-radius: 6px; background-color: #ffffff; color: #151435; font-size: 0.95rem; height: 42px; box-sizing: border-box;"
                placeholder="Enter 6-digit OTP" maxlength="6" required>
          </div>

          <!-- New Password -->
          <div style="margin-bottom: 20px;">
            <div style="font-weight: 500; margin-bottom: 8px; color: #151435; font-size: 0.95rem;">New Password</div>
            <input type="password" id="newPass" 
                style="width: 100%; padding: 10px 12px; border: 1px solid #151435; border-radius: 6px; background-color: #ffffff; color: #151435; font-size: 0.95rem; height: 42px; box-sizing: border-box;"
                placeholder="Enter new password" required>
          </div>

          <!-- Confirm Password -->
          <div style="margin-bottom: 20px;">
            <div style="font-weight: 500; margin-bottom: 8px; color: #151435; font-size: 0.95rem;">Confirm Password</div>
            <input type="password" id="confirmPass" 
                style="width: 100%; padding: 10px 12px; border: 1px solid #151435; border-radius: 6px; background-color: #ffffff; color: #151435; font-size: 0.95rem; height: 42px; box-sizing: border-box;"
                placeholder="Confirm new password" required>
          </div>
        </div>
      `,
      confirmButtonText: "Reset Password",
      showCancelButton: true,
      cancelButtonText: "Cancel",
      allowOutsideClick: false,
      customClass: {
        popup: 'custom-forgot-popup',
        title: 'custom-forgot-title',
        confirmButton: 'custom-forgot-confirm-btn',
        cancelButton: 'custom-forgot-cancel-btn',
        actions: 'custom-forgot-actions'
      },
      preConfirm: async () => {
        const otp = document.getElementById("otpInput").value.trim();
        const p1 = document.getElementById("newPass").value;
        const p2 = document.getElementById("confirmPass").value;

        if (!otp || !p1 || !p2) {
          Swal.showValidationMessage("All fields are required!");
          return false;
        }

        if (otp.length !== 6) {
          Swal.showValidationMessage("OTP must be 6 digits!");
          return false;
        }

        if (p1 !== p2) {
          Swal.showValidationMessage("Passwords do not match!");
          return false;
        }

        if (p1.length < 6) {
          Swal.showValidationMessage("Password must be at least 6 characters!");
          return false;
        }

        const formData = new FormData();
        formData.append("otp", otp);
        formData.append("password", p1);
        formData.append("confirm_password", p2);

        try {
          const res = await fetch("/verify-otp", { method: "POST", body: formData });
          const result = await res.json();

          if (result.status === "success") {
            Swal.fire({
              icon: "success",
              title: "Success!",
              text: result.message,
              confirmButtonText: "Go to Login",
              customClass: {
                popup: 'custom-forgot-popup',
                confirmButton: 'custom-forgot-confirm-btn'
              }
            }).then(() => {
              window.location.href = "/login";
            });
            return true;
          } else {
            Swal.showValidationMessage(result.message);
            return false;
          }
        } catch (error) {
          console.error('Error:', error);
          Swal.showValidationMessage("Server error occurred!");
          return false;
        }
      },
      didOpen: () => {
        // OTP input validation - only numbers
        const otpInput = document.getElementById('otpInput');
        otpInput.addEventListener('input', function() {
          this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        // Auto-focus on OTP input
        otpInput.focus();

        // Auto-fill OTP for convenience
        otpInput.value = otpCode;

        // Timer countdown
        const timerInterval = setInterval(() => {
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            const timerElement = document.getElementById('otp-timer');
            if (timerElement) {
              timerElement.innerHTML = "OTP Expired!";
              timerElement.style.color = "red";
            }
            return;
          }
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          const timerElement = document.getElementById('otp-timer');
          if (timerElement) {
            timerElement.innerHTML = `Time remaining: ${minutes}:${seconds.toString().padStart(2, "0")}`;
          }
          timeLeft--;
        }, 1000);
      }
    });
  }

  // Add custom CSS for SweetAlert popup (EDIT PROFILE FORM DESIGN)
  const style = document.createElement('style');
  style.textContent = `
    .custom-forgot-popup {
      background-color: #d7e6fa !important;
      border: 1px solid #151435 !important;
      border-radius: 15px !important;
      box-shadow: 0 0 15px rgba(21, 20, 53, 0.2) !important;
      max-width: 500px !important;
      width: 90% !important;
      color: #151435 !important;
      padding: 30px !important;
    }

    .custom-forgot-title {
      color: #151435 !important;
      font-weight: 700 !important;
      font-size: 2rem !important;
      text-align: center !important;
      margin-bottom: 25px !important;
      width: 100% !important;
    }

    .custom-forgot-confirm-btn {
      background-color: #151435 !important;
      color: #d7e6fa !important;
      border: none !important;
      border-radius: 20px !important;
      font-size: 1rem !important;
      font-weight: 600 !important;
      padding: 12px 30px !important;
      transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s !important;
      box-shadow: 0 4px 8px rgba(21, 20, 53, 0.2) !important;
      width: 100% !important;
      margin-top: 10px !important;
    }

    .custom-forgot-confirm-btn:hover {
      background-color: #2c3e50 !important;
      transform: translateY(-1px) !important;
    }

    .custom-forgot-cancel-btn {
      background-color: transparent !important;
      color: #151435 !important;
      border: 1px solid #151435 !important;
      border-radius: 20px !important;
      font-size: 1rem !important;
      font-weight: 600 !important;
      padding: 12px 30px !important;
      transition: all 0.3s !important;
      width: 100% !important;
      margin-top: 5px !important;
    }

    .custom-forgot-cancel-btn:hover {
      background-color: #151435 !important;
      color: #d7e6fa !important;
    }

    .custom-forgot-actions {
      display: flex !important;
      flex-direction: column !important;
      gap: 5px !important;
      width: 100% !important;
    }

    /* Input focus states */
    input:focus {
      border-color: #2c3e50 !important;
      box-shadow: 0 0 5px rgba(21, 20, 53, 0.2) !important;
      outline: none !important;
    }
  `;
  document.head.appendChild(style);

});
</script>

{% endblock %}
